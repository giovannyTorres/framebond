name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            pandas: "latest"
          - python: "3.12"
            pandas: "latest"
          - python: "3.13"
            pandas: "latest"
          - python: "3.14"
            pandas: "latest"
          - python: "3.11"
            pandas: "2.2.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - if: matrix.pandas != 'latest'
        run: python -m pip install "pandas==${{ matrix.pandas }}"
      - run: python -m pytest --cov=framebond --cov-report=term-missing --cov-fail-under=95
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_artifacts.py framebond
